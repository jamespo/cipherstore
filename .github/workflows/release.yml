name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # Linux is built and packaged with GoReleaser, cross-compiling amd64/arm64
  # from a single runner (see .goreleaser.yml). This produces the tar.gz
  # archives, the apk/deb/rpm/archlinux packages (each carrying the user
  # systemd unit from contrib/), checksums.txt and the changelog.
  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install aarch64 cross-compiler (CGO for linux/arm64)
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          # Builds and packages, but does not publish: the combine job below
          # creates one release carrying both this job's assets and macOS's.
          args: release --clean --skip=publish,sign
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux assets
        uses: actions/upload-artifact@v7
        with:
          name: dist-linux
          path: |
            dist/*.tar.gz
            dist/*.apk
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
            dist/CHANGELOG.md
          if-no-files-found: error

  # SQLCipher needs CGO, which cannot realistically be cross-compiled for
  # Darwin from a Linux runner, so macOS binaries are built on a macOS runner
  # instead of through GoReleaser. Both architectures are built on the same
  # (Apple Silicon) runner: Xcode's clang cross-compiles for x86_64 just as
  # well as it compiles natively for arm64, which sidesteps needing an actual
  # Intel runner -- GitHub retired the free one (macos-13) in December 2025,
  # and its replacements are a paid "larger runners" tier.
  macos:
    runs-on: macos-14
    strategy:
      matrix:
        include:
          - goarch: arm64
            archlabel: arm64
            cc: ""
          - goarch: amd64
            archlabel: x86_64
            cc: "clang -arch x86_64"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Determine release version
        id: ver
        # GoReleaser's .Version strips the tag's leading "v"; match that so
        # linux and darwin assets of the same release share one scheme.
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          CGO_ENABLED: "1"
          GOARCH: ${{ matrix.goarch }}
          CC: ${{ matrix.cc }}
          CGO_CFLAGS: ${{ matrix.cc != '' && '-arch x86_64' || '' }}
          CGO_LDFLAGS: ${{ matrix.cc != '' && '-arch x86_64' || '' }}
        run: |
          go build -trimpath \
            -ldflags "-s -w -X github.com/jamespo/cipherstore/internal/cli.version=${{ steps.ver.outputs.version }}" \
            -o cipherstore .

      - name: Archive
        run: |
          # Flat layout (no wrapping directory), matching the Linux archives
          # GoReleaser produces in the other job.
          name="cipherstore_${{ steps.ver.outputs.version }}_darwin_${{ matrix.archlabel }}"
          mkdir stage
          cp cipherstore README.md stage/
          tar -czf "$name.tar.gz" -C stage cipherstore README.md

      - name: Upload macOS asset
        uses: actions/upload-artifact@v7
        with:
          name: dist-darwin-${{ matrix.archlabel }}
          path: cipherstore_*_darwin_*.tar.gz
          if-no-files-found: error

  # Combines the Linux and macOS jobs' assets into a single GitHub release,
  # since neither job alone can produce the full set.
  release:
    needs: [linux, macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download all assets
        uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Rebuild checksums over the full asset set
        working-directory: dist
        run: |
          rm -f checksums.txt
          sha256sum *.tar.gz *.apk *.deb *.rpm *.pkg.tar.zst > checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          body_path: dist/CHANGELOG.md
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/*.apk
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
            dist/checksums.txt
